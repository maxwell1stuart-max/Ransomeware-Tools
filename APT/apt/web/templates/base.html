<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}APT — Automated Penetration Toolkit{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/main.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body class="dark-theme">

  <nav class="sidebar">
    <div class="sidebar-logo">
      <!-- Crosshair / target icon in blue -->
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="18" stroke="#4299e1" stroke-width="2"/>
        <circle cx="20" cy="20" r="8" stroke="#4299e1" stroke-width="2"/>
        <circle cx="20" cy="20" r="2" fill="#63b3ed"/>
        <line x1="20" y1="2" x2="20" y2="10" stroke="#4299e1" stroke-width="2" stroke-linecap="round"/>
        <line x1="20" y1="30" x2="20" y2="38" stroke="#4299e1" stroke-width="2" stroke-linecap="round"/>
        <line x1="2" y1="20" x2="10" y2="20" stroke="#4299e1" stroke-width="2" stroke-linecap="round"/>
        <line x1="30" y1="20" x2="38" y2="20" stroke="#4299e1" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span class="logo-text">APT</span>
    </div>

    <ul class="nav-links">
      <li><a href="/" class="nav-item {% if request.path == '/' %}active{% endif %}">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Dashboard
      </a></li>
      <li><a href="/scan" class="nav-item {% if request.path == '/scan' %}active{% endif %}">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><circle cx="11" cy="11" r="3"/><line x1="11" y1="3" x2="11" y2="1"/><line x1="11" y1="21" x2="11" y2="19"/><line x1="3" y1="11" x2="1" y2="11"/><line x1="21" y1="11" x2="19" y2="11"/></svg>
        Scan
      </a></li>
      <li><a href="/cases" class="nav-item {% if request.path == '/cases' %}active{% endif %}">
        <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
        Engagements
      </a></li>
      <li><a href="/settings" class="nav-item {% if request.path == '/settings' %}active{% endif %}">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        Settings
      </a></li>
    </ul>

    <div class="sidebar-footer">
      <div class="version">APT v1.0 · port 5001</div>
    </div>
  </nav>

  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <script src="/static/js/main.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
