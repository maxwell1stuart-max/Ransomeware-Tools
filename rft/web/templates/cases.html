{% extends "base.html" %}
{% block title %}Cases — RFT{% endblock %}
{% block content %}

<div class="page-header">
  <h1>All Cases</h1>
  <p class="subtitle">History of analyzed drives and generated reports.</p>
</div>

<div id="cases-container">
  <div class="loading-spinner"><div class="spinner"></div><p>Loading cases...</p></div>
</div>

<script>
async function loadCases() {
  const resp = await fetch('/api/cases').then(r => r.json()).catch(() => ({cases: []}));
  const cases = resp.cases || [];
  const el = document.getElementById('cases-container');

  if (!cases.length) {
    el.innerHTML = `<div class="empty-state">
      <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
      <p>No cases yet. <a href="/analyze">Analyze a drive</a> to get started.</p>
    </div>`;
    return;
  }

  el.innerHTML = `
    <div style="margin-bottom:1rem;color:var(--text-muted);font-size:0.85rem;">
      ${cases.length} case record${cases.length !== 1 ? 's' : ''} — persisted across restarts
    </div>
    <div class="table-container">
      <table class="data-table">
        <thead>
          <tr>
            <th>Case ID</th>
            <th>Device</th>
            <th>Ransomware Family</th>
            <th>Files Encrypted</th>
            <th>Attack Vector</th>
            <th>Status</th>
            <th>Started</th>
            <th>Completed</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          ${cases.map(c => `
            <tr>
              <td class="mono" style="font-size:0.8rem;">${esc(c.case_id)}</td>
              <td class="mono" style="font-size:0.8rem;">${esc(c.device || '—')}</td>
              <td><span class="badge badge-${c.family === 'Unknown' ? 'gray' : 'red'}">${esc(c.family || 'Unknown')}</span></td>
              <td style="text-align:right;">${c.encrypted_count ? c.encrypted_count.toLocaleString() : '—'}</td>
              <td style="font-size:0.85rem;">${esc(c.attack_vector || '—')}</td>
              <td><span class="badge badge-${statusColor(c.status)}">${esc(c.status)}</span></td>
              <td style="font-size:0.8rem;">${formatDate(c.started_at)}</td>
              <td style="font-size:0.8rem;">${c.completed_at ? formatDate(c.completed_at) : '—'}</td>
              <td style="white-space:nowrap;">
                ${c.has_report ? `<a href="/report/${esc(c.case_id)}" class="btn btn-ghost btn-sm">Report</a>` : '<span style="color:var(--text-muted);font-size:0.8rem;">No report</span>'}
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function statusColor(s) {
  return {complete:'green', error:'red', analyzing:'yellow', mounting:'yellow'}[s] || 'gray';
}
function formatDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString();
}
function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

loadCases();
</script>
{% endblock %}
