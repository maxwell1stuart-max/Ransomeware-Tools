<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}RFT — Ransomware Forensics Toolkit{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/main.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body class="dark-theme">

  <!-- Sidebar Navigation -->
  <nav class="sidebar">
    <div class="sidebar-logo">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="19" stroke="#e53e3e" stroke-width="2"/>
        <path d="M13 27V18l7-6 7 6v9H23v-5h-6v5H13z" fill="#e53e3e"/>
        <circle cx="20" cy="14" r="2" fill="#fc8181"/>
      </svg>
      <span class="logo-text">RFT</span>
    </div>

    <ul class="nav-links">
      <li><a href="/" class="nav-item {% if request.path == '/' %}active{% endif %}">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Dashboard
      </a></li>
      <li><a href="/analyze" class="nav-item {% if request.path == '/analyze' %}active{% endif %}">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Analyze Drive
      </a></li>
      <li><a href="/cases" class="nav-item {% if request.path == '/cases' %}active{% endif %}">
        <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
        Cases
      </a></li>
      <li><a href="/knowledge" class="nav-item {% if request.path == '/knowledge' %}active{% endif %}">
        <svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg>
        Knowledge Base
      </a></li>
      <li><a href="/network" class="nav-item {% if request.path == '/network' %}active{% endif %}">
        <svg viewBox="0 0 24 24"><rect x="2" y="2" width="6" height="6" rx="1"/><rect x="16" y="2" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="16" y="16" width="6" height="6" rx="1"/><line x1="5" y1="8" x2="12" y2="12"/><line x1="19" y1="8" x2="12" y2="12"/><line x1="5" y1="16" x2="12" y2="15"/><line x1="19" y1="16" x2="12" y2="15"/></svg>
        Network
      </a></li>
      <li><a href="/settings" class="nav-item {% if request.path == '/settings' %}active{% endif %}">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        Settings
      </a></li>
    </ul>

    <div class="sidebar-footer">
      <div class="api-status" id="api-status">
        <span class="status-dot" id="api-dot"></span>
        <span id="api-label">AI: checking...</span>
      </div>
      <div class="version">RFT v1.0</div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <script src="/static/js/main.js"></script>
  {% block scripts %}{% endblock %}

</body>
</html>
